name: Validate harness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify executable harness behaviour
        run: npm test
      - name: Verify policy consistency
        run: npm run validate:design
      - name: Verify policy mutation rejection
        run: npm run test:design
