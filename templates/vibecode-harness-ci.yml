name: VibeCode project gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # The final checker runs in the portal. This workflow enforces only the
    # local language/project policy and project tests before a branch is merged.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify project language policy and tests
        run: node .vibecode-harness/bin/gg.mjs verify --project . --run-tests
